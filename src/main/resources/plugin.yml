name: BlockAnimatePlugin
description: Animates block structures frame by frame.
version: '${version}'

main: net.dvmn2.blockanimateplugin.BlockAnimatePlugin
api-version: '1.21'
load: POSTWORLD

authors: [ DVMN2 ]

permissions:
  blockanimate.use:
    description: Use /blockanimate, list and inspect animations
    default: op
  blockanimate.select:
    description: Use the selection wand and /blockanimate pos1, pos2
    default: op
  blockanimate.edit:
    description: Create, delete, move and copy animations, add, replace and remove frames
    default: op
  blockanimate.play:
    description: Play and stop animations, show single frames, move or copy blocks together with an animation
    default: op
  blockanimate.reload:
    description: Use /blockanimate reload
    default: op
  blockanimate.admin:
    description: All administrative Block Animate permissions
    default: op
    children:
      blockanimate.use: true
      blockanimate.select: true
      blockanimate.edit: true
      blockanimate.play: true
      blockanimate.reload: true
