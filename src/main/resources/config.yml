settings:
  # Plugin message language: "ru", "en" or "auto".
  # "auto" uses the player's client locale; the console always gets English.
  language: auto

  # Maximum number of blocks in one animation region (1..1000000).
  # Every frame stores one entry per block, so memory use grows with volume * frames.
  # Default: 100000
  max-volume-blocks: 100000

  # Maximum number of frames per animation (1..1000).
  # Default: 200
  max-frames: 200

  # Maximum number of animations that can play at the same time (1..64).
  # Default: 8
  max-running-animations: 8

  # Maximum number of blocks one animation may change per tick (64..100000).
  # Frames with more changed blocks are applied over several ticks.
  # Default: 4096
  max-blocks-per-tick: 4096

  # Whether placed blocks trigger physics (gravity, fluid flow, redstone updates): true or false.
  # Default: false
  apply-physics: false

  # What happens when an operation hits a busy animation or area (the animation is playing, capturing or
  # moving, or the area overlaps a running animation or move): true or false.
  # false: the command is refused. true: the operation waits in a queue and starts by itself, in order,
  # when the area is free. Affects play, frame show, frame add, frame replace and move (also copy ... show).
  # Playing in loop or pingpong mode never ends, so operations queued behind it wait until /blockanimate stop.
  # /blockanimate stop also removes the queued operations. The queue is not saved over restarts.
  # Default: false
  queue-busy-operations: false

  # Maximum number of operations waiting in the queue, for all animations together (1..256).
  # A new operation is refused while the queue is full. Used only when queue-busy-operations is true.
  # Default: 32
  max-queued-operations: 32

  # How often changed animations are written to disk, in seconds (5..3600).
  # Default: 30
  autosave-seconds: 30
